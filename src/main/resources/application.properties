# CONFIGURACIÓN DEL SERVIDOR
server.port=8082

# CONFIGURACIÓN DE CONEXIÓN A SUPABASE CLOUD (USANDO EL POOLER IPV4 AWS-1)
# Se utiliza el pooler en el puerto 6543 (Transaction Mode) con prepareThreshold=0 para evitar fallos de Hibernate
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.lomqhgclvuooviyesnsx
spring.datasource.password=-Cr@ft:2347

# Configuración del Driver de PostgreSQL e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Permitir la carga de archivos grandes en el sistema (Contratos y documentos de propiedad en PDF)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Configuración del Pool de Conexiones Hikari para evitar conexiones cerradas por Supabase
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

